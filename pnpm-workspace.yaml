packages:
  - 'apps/*'
# pnpm 11's automatic pre-script install would undo opt-in local kit links.
# Installs stay explicit; CI installs the committed lockfile with --frozen-lockfile.
verifyDepsBeforeRun: false
allowBuilds:
  core-js: true
  esbuild: true
  plyr: false
  sharp: true
  workerd: true
# First-party packages we publish ourselves — exempt from the minimum-release-age
# supply-chain cooldown (the cooldown guards against compromised third-party
# publishes; it doesn't apply to our own code, and otherwise blocks deploying a
# just-published contrail for ~24h). Scope glob so we don't re-add per version.
minimumReleaseAgeExclude:
  - '@atmo-dev/*'
  - '@svelte-atproto/*'
  - svelte@5.57.3
  # Runs the e2e tests' local network. Exempt so a new release can be tested as
  # soon as it is published.
  - '@openmeet/snowglobe'
patchedDependencies:
  '@atmo-dev/kit@0.7.2': patches/@atmo-dev__kit@0.7.2.patch
