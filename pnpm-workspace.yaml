packages:
  - 'apps/*'
# pnpm 11's automatic pre-script install would undo opt-in local kit links.
# Installs stay explicit; CI installs the committed lockfile with --frozen-lockfile.
verifyDepsBeforeRun: false
allowBuilds:
  core-js: true
  esbuild: true
  plyr: false
  sharp: true
  workerd: true
# First-party packages we publish ourselves — exempt from the minimum-release-age
# supply-chain cooldown (the cooldown guards against compromised third-party
# publishes; it doesn't apply to our own code, and otherwise blocks deploying a
# just-published contrail for ~24h). Scope glob so we don't re-add per version.
minimumReleaseAgeExclude:
  - '@atmo-dev/*'
  - '@svelte-atproto/*'
  - svelte@5.57.3
  # Runs the e2e tests' local network. Exempt so a new release can be tested as
  # soon as it is published.
  - '@openmeet/snowglobe'
# @atproto/space is published only as dated spaces alphas, which depend on each other
# through caret ranges. Those ranges also match 0.0.0-stage, which sorts above every alpha
# and was published with workspace: dependencies that cannot install. These pin the alpha's
# own dependencies to that same alpha, and leave every other @atproto version as it was.
# Change them together with @atproto/space's version: pnpm applies an override to any range
# that overlaps it, so a later alpha's dependencies would land on these.
overrides:
  '@atproto/crypto@^0.0.0-spaces-alpha-20261112204144': 0.0.0-spaces-alpha-20261112204144
  '@atproto/lex-cbor@^0.0.0-spaces-alpha-20261112204144': 0.0.0-spaces-alpha-20261112204144
  '@atproto/lex-data@^0.0.0-spaces-alpha-20261112204144': 0.0.0-spaces-alpha-20261112204144
  '@atproto/lex-schema@^0.0.0-spaces-alpha-20261112204144': 0.0.0-spaces-alpha-20261112204144
  '@atproto/star@^0.0.0-spaces-alpha-20261112204144': 0.0.0-spaces-alpha-20261112204144
  '@atproto/syntax@^0.0.0-spaces-alpha-20261112204144': 0.0.0-spaces-alpha-20261112204144
